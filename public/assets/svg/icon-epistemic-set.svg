<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="The four epistemic labels: IN, OUT, UNKNOWN, UNFOUNDED">
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .label { font-size: 24px; font-weight: 700; letter-spacing: 1.5px; }
    .meaning { font-size: 15.5px; fill: #99a1ad; }
    .title { font-size: 20px; font-weight: 600; fill: #e6e9ee; }
  </style>

  <!-- Colour encodes epistemic status, never severity. src/theme.ts -->
  <rect width="960" height="220" rx="16" fill="#0b0d10"/>

  <text x="32" y="44" font-size="17" font-weight="700" letter-spacing="2" fill="#6a7280">COLOUR ENCODES EPISTEMIC STATUS, NEVER SEVERITY</text>

  <!-- IN -->
  <g transform="translate(32,72)">
    <rect width="212" height="120" rx="12" fill="#12151a" stroke="#232830"/>
    <circle cx="26" cy="34" r="10" fill="none" stroke="#4ade80" stroke-width="3"/>
    <text x="48" y="42" class="label" fill="#4ade80">IN</text>
    <text x="20" y="74" class="meaning">Supported — a justification</text>
    <text x="20" y="96" class="meaning">currently holds.</text>
  </g>

  <!-- OUT -->
  <g transform="translate(260,72)">
    <rect width="212" height="120" rx="12" fill="#12151a" stroke="#232830"/>
    <circle cx="26" cy="34" r="10" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <line x1="19" y1="27" x2="33" y2="41" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <text x="48" y="42" class="label" fill="#94a3b8">OUT</text>
    <text x="20" y="74" class="meaning">Retracted — kept, never</text>
    <text x="20" y="96" class="meaning">deleted, still searchable.</text>
  </g>

  <!-- UNKNOWN -->
  <g transform="translate(488,72)">
    <rect width="212" height="120" rx="12" fill="#12151a" stroke="#232830"/>
    <circle cx="26" cy="34" r="10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4 3"/>
    <text x="48" y="42" class="label" fill="#fbbf24">UNKNOWN</text>
    <text x="20" y="74" class="meaning">Unresolved — neither</text>
    <text x="20" y="96" class="meaning">confirmed nor refuted.</text>
  </g>

  <!-- UNFOUNDED -->
  <g transform="translate(716,72)">
    <rect width="212" height="120" rx="12" fill="#12151a" stroke="#232830"/>
    <circle cx="26" cy="34" r="10" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="1 3" stroke-linecap="round"/>
    <text x="48" y="42" class="label" fill="#a78bfa">UNFOUNDED</text>
    <text x="20" y="74" class="meaning">Data-quality warning — the</text>
    <text x="20" y="96" class="meaning">chain never reaches a premise.</text>
  </g>
</svg>
