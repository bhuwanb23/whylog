<?xml version="1.0" encoding="UTF-8"?>
<!-- WhyLog Decision Extraction Flow -->
<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .stage { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a2e; }
      .step { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; fill: #666666; }
      .arrow { fill: #e94560; marker-end: url(#arrowhead); }
      .box { fill:#fff; stroke:#dee2e6; stroke-width:1; rx:6; ry:6; }
      .box-orange { fill:#fff3e0; stroke:#f66; stroke-width:1; rx:6; ry:6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#e94560">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  
  <text x="500" y="40" text-anchor="middle" class="title" font-size="22">WhyLog — Decision Extraction Flow</text>
  
  <!-- Stage 1: Transcript Input -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="180" height="60" class="box-orange" rx="6"/>
    <text x="90" y="25" text-anchor="middle" class="stage">1. Transcript Input</text>
    <text x="90" y="42" text-anchor="middle" class="step">Raw text / audio</text>
  </g>
  
  <!-- Stage 2: Parse -->
  <g transform="translate(380, 100)">
    <rect x="0" y="0" width="180" height="60" class="box" rx="6"/>
    <text x="90" y="25" text-anchor="middle" class="stage">2. Parse</text>
    <text x="90" y="42" text-anchor="middle" class="step">Tokenize · segment · detect speech acts</text>
  </g>
  
  <!-- Stage 3: Extract Decisions -->
  <g transform="translate(610, 100)">
    <rect x="0" y="0" width="180" height="60" class="box-orange" rx="6"/>
    <text x="90" y="25" text-anchor="middle" class="stage">3. Extract Decisions</text>
    <text x="90" y="42" text-anchor="middle" class="step">Propositions · claims · verdicts</text>
  </g>
  
  <!-- Stage 4: Extract Premises -->
  <g transform="translate(840, 100)">
    <rect x="0" y="0" width="180" height="60" class="box" rx="6"/>
    <text x="90" y="25" text-anchor="middle" class="stage">4. Extract Premises</text>
    <text x="90" y="42" text-anchor="middle" class="step">Reasons · evidence · citations</text>
  </g>
  
  <!-- Arrows -->
  <g fill="none" stroke="#e94560" stroke-width="3">
    <path d="M330 70 C330 30 410 30 410 70"/>
    <path d="M560 70 C560 30 640 30 640 70"/>
    <path d="M790 70 C790 30 870 30 870 70"/>
  </g>
  
  <!-- Below: Provenance chain -->
  <g transform="translate(200, 250)">
    <rect x="0" y="0" width="180" height="50" class="box" rx="6"/>
    <text x="90" y="20" text-anchor="middle" class="step">Provenance: source tracking</text>
  </g>
  
  <g transform="translate(430, 250)">
    <rect x="0" y="0" width="180" height="50" class="box" rx="6"/>
    <text x="90" y="20" text-anchor="middle" class="step">Evidence graph constructed</text>
  </g>
  
  <g transform="translate(660, 250)">
    <rect x="0" y="0" width="180" height="50" class="box" rx="6"/>
    <text x="90" y="20" text-anchor="middle" class="step">RRF ranking & reranking</text>
  </g>
  
  <g transform="translate(890, 250)">
    <rect x="0" y="0" width="180" height="50" class="box" rx="6"/>
    <text x="90" y="20" text-anchor="middle" class="step">Export & presentation</text>
  </g>
  
  <!-- Invariants -->
  <g transform="translate(500, 520)">
    <rect x="0" y="0" width="300" height="50" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" rx="4"/>
    <text x="150" y="25" text-anchor="middle" class="step" font-size="12">I3: Extraction is deterministic given the same transcript</text>
    <text x="150" y="40" text-anchor="middle" class="step" font-size="12">I4: Alternative options always scored</text>
  </g>
  
  <!-- AI Seam note -->
  <g transform="translate(850, 550)">
    <rect x="0" y="0" width="120" height="40" fill="#fff8e1" stroke="#f39c12" stroke-width="1" rx="4"/>
    <text x="60" y="20" text-anchor="middle" class="step" font-size="11">@/store/extraction</text>
  </g>
</svg>
