<?xml version="1.0" encoding="UTF-8"?>
<!-- WhyLog Phase Flow Diagram -->
<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .phase { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #1a1a2e; }
      .step { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; fill: #666666; }
      .arrow { fill: #e94560; marker-end: url(#arrowhead); }
      .bg-rect { fill: #f8f9fa; stroke:#dee2e6; stroke-width:1; rx:6; ry:6; }
      .bg-circle { fill:#4a90e2; stroke:#2c5aa0; stroke-width:2; rx:50%; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#e94560">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  
  <text x="500" y="40" text-anchor="middle" class="title" font-size="22">WhyLog — Phase Flow</text>
  
  <!-- Phase steps in a circle/line -->
  <g transform="translate(200, 300)">
    <line x1="0" y1="0" x2="0" y2="200" stroke="#888" stroke-width="1"/>
    <circle cx="0" cy="200" r="80" fill="none" stroke="#888" stroke-width="1"/>
  </g>
  
  <text x="0" y="-5" text-anchor="middle" class="phase" transform="rotate(-90)">Phase 0: Initialization</text>
  <text x="0" y="210" text-anchor="middle" class="phase">Phase 1: Extraction</text>
  <text x="0" y="290" text-anchor="middle" class="phase">Phase 2: Indexing</text>
  <text x="0" y="370" text-anchor="middle" class="phase">Phase 3: Reasoning</text>
  <text x="0" y="450" text-anchor="middle" class="phase">Phase 4: Synthesis</text>
  <text x="0" y="530" text-anchor="middle" class="phase">Phase 5: Presentation</text>
  
  <!-- Arrows between phases -->
  <g fill="none" stroke="#e94560" stroke-width="3">
    <path d="M0 280 C50 280 150 280 200 280"/>
    <path d="M0 360 C50 360 150 360 200 360"/>
    <path d="M0 440 C50 440 150 440 200 440"/>
    <path d="M0 520 C50 520 150 520 200 520"/>
  </g>
  
  <!-- AI Seam note -->
  <g transform="translate(800, 300)">
    <rect x="0" y="0" width="180" height="100" fill="#fff8e1" stroke="#f39c12" stroke-width="1" rx="6"/>
    <text x="90" y="30" text-anchor="middle" class="phase" font-size="12">AI Seam: LLM + Local implementations</text>
    <text x="90" y="50" text-anchor="middle" class="step" font-size="11">@/ai/local + @/ai/llm</text>
  </g>
  
  <!-- Key -->
  <g transform="translate(850, 550)">
    <rect x="0" y="0" width="120" height="40" fill="#f5f5f5" stroke:#ccc stroke-width="1" rx="4"/>
    <text x="60" y="20" text-anchor="middle" class="step" font-size="11">5 phases · top-down</text>
  </g>
</svg>
