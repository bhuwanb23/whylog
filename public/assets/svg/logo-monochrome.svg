<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160" role="img" aria-label="WhyLog">
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Single-ink version: one colour, no fills that depend on a background.
       Use on light surfaces, in print, or anywhere the brand palette is unavailable. -->
  <g transform="translate(0,16)">
    <rect width="128" height="128" rx="28" fill="none" stroke="#14171c" stroke-width="4"/>
    <path d="M40 58 L54 74 M88 58 L74 74" stroke="#14171c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M40 58 L74 74" stroke="#14171c" stroke-width="3" fill="none" stroke-dasharray="5 4" stroke-linecap="round"/>
    <circle cx="40" cy="44" r="14" fill="#ffffff" stroke="#14171c" stroke-width="4"/>
    <circle cx="88" cy="44" r="14" fill="#ffffff" stroke="#14171c" stroke-width="4"/>
    <rect x="44" y="74" width="40" height="40" rx="11" fill="#14171c"/>
  </g>

  <text x="160" y="86" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#14171c">WhyLog</text>
  <text x="162" y="122" font-size="17.5" letter-spacing="0.2" fill="#4d5560">a decision log that checks itself</text>
</svg>
