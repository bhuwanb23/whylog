<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="WhyLog hero banner">
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .h1 { font-size: 68px; font-weight: 700; fill: #e6e9ee; letter-spacing: -2; }
    .sub { font-size: 22px; fill: #99a1ad; }
    .brand { font-size: 40px; font-weight: 700; fill: #e6e9ee; letter-spacing: -1; }
    .tag { font-size: 19px; fill: #99a1ad; }
    .chip { font-size: 17px; font-weight: 600; fill: #e6e9ee; }
    .foot { font-size: 16px; fill: #6a7280; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#07090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.75" r="0.7">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#171b22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#232830"/>

  <!-- brand -->
  <g transform="translate(72,56) scale(0.8)">
    <rect width="128" height="128" rx="28" fill="#0b0d10" stroke="#232830" stroke-width="2"/>
    <path d="M40 58 L54 74 M88 58 L74 74" stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M40 58 L74 74" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-dasharray="5 4" stroke-linecap="round"/>
    <circle cx="40" cy="44" r="14" fill="#0b0d10" stroke="#4ade80" stroke-width="3.5"/>
    <circle cx="88" cy="44" r="14" fill="#0b0d10" stroke="#4ade80" stroke-width="3.5"/>
    <rect x="44" y="74" width="40" height="40" rx="11" fill="#4ade80"/>
  </g>
  <text x="196" y="124" class="brand">WhyLog</text>
  <text x="196" y="156" class="tag">a decision log that checks itself</text>

  <!-- headline -->
  <text x="72" y="330" class="h1">Your agent forgets</text>
  <text x="72" y="406" class="h1">the given.</text>
  <text x="72" y="456" class="sub">"SQLite, not Postgres" was true given single-user, no deploy, no concurrent writers.</text>
  <text x="72" y="488" class="sub">Six weeks later nobody contradicts you — the world just moved. WhyLog notices.</text>

  <!-- chips -->
  <g transform="translate(72,530)">
    <g>
      <rect width="252" height="48" rx="24" fill="#12151a" stroke="#232830"/>
      <circle cx="28" cy="24" r="8" fill="#4ade80"/>
      <text x="50" y="30" class="chip">local engine · keyless</text>
    </g>
    <g transform="translate(272,0)">
      <rect width="286" height="48" rx="24" fill="#12151a" stroke="#232830"/>
      <circle cx="28" cy="24" r="8" fill="#fbbf24"/>
      <text x="50" y="30" class="chip">gate (c): premise OUT</text>
    </g>
    <g transform="translate(578,0)">
      <rect width="304" height="48" rx="24" fill="#12151a" stroke="#232830"/>
      <circle cx="28" cy="24" r="8" fill="#60a5fa"/>
      <text x="50" y="30" class="chip">cascade with survivors</text>
    </g>
    <g transform="translate(902,0)">
      <rect width="234" height="48" rx="24" fill="#12151a" stroke="#232830"/>
      <circle cx="28" cy="24" r="8" fill="#a78bfa"/>
      <text x="50" y="30" class="chip">propose, never apply</text>
    </g>
  </g>

  <text x="1208" y="612" class="foot" text-anchor="end">append-only · bi-temporal · hash-chained · MIT</text>
</svg>
