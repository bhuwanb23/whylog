<?xml version="1.0" encoding="UTF-8"?>
<!-- WhyLog End-to-End Decision Flow -->
<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .phase { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a2e; }
      .step { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; fill: #666666; }
      .arrow { fill: #e94560; marker-end: url(#arrowhead); }
      .box { fill:#fff; stroke:#dee2e6; stroke-width:1; rx:6; ry:6; }
      .box-orange { fill:#fff3e0; stroke:#f66; stroke-width:1; rx:6; ry:6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#e94560">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  
  <text x="500" y="40" text-anchor="middle" class="title">WhyLog — End-to-End Flow</text>
  
  <!-- Input -->
  <g transform="translate(150, 80)">
    <rect x="0" y="0" width="180" height="60" class="box-orange" rx="6"/>
    <text x="90" y="25" text-anchor="middle" class="step">1. Input:</text>
    <text x="90" y="42" text-anchor="middle" class="value">Audio / Text transcript</text>
  </g>
  
  <!-- Parse -->
  <g transform="translate(380, 80)">
    <rect x="0" y="0" width="180" height="60" class="box" rx="6"/>
    <text x="90" y="25" text-anchor="middle" class="step">2. Parse:</text>
    <text x="90" y="42" text-anchor="middle" class="value">Tokenize · speech acts</text>
  </g>
  
  <!-- Extract Decisions -->
  <g transform="translate(610, 80)">
    <rect x="0" y="0" width="180" height="60" class="box-orange" rx="6"/>
    <text x="90" y="25" text-anchor="middle" class="step">3. Extract:</text>
    <text x="90" y="42" text-anchor="middle" class="value">Decisions · premises</text>
  </g>
  
  <!-- Index -->
  <g transform="translate(840, 80)">
    <rect x="0" y="0" width="180" height="60" class="box" rx="6"/>
    <text x="90" y="25" text-anchor="middle" class="step">4. Index:</text>
    <text x="90" y="42" text-anchor="middle" class="value">4-level index · RRF</text>
  </g>
  
  <!-- Reason -->
  <g transform="translate(150, 200)">
    <rect x="0" y="0" width="180" height="60" class="box-orange" rx="6"/>
    <text x="90" y="25" text-anchor="middle" class="step">5. Reason:</text>
    <text x="90" y="42" text-anchor="middle" class="value">JTMS · 3-gates · cascade</text>
  </g>
  
  <!-- Synthesize -->
  <g transform="translate(380, 200)">
    <rect x="0" y="0" width="180" height="60" class="box-orange" rx="6"/>
    <text x="90" y="25" text-anchor="middle" class="step">6. Synthesize:</text>
    <text x="90" y="42" text-anchor="middle" class="value">answer() · export</text>
  </g>
  
  <!-- Output -->
  <g transform="translate(610, 200)">
    <rect x="0" y="0" width="180" height="60" class="box-orange" rx="6"/>
    <text x="90" y="25" text-anchor="middle" class="step">7. Output:</text>
    <text x="90" y="42" text-anchor="middle" class="value">Timeline · Lattice · Export</text>
  </g>
  
  <!-- Arrows -->
  <g fill="none" stroke="#e94560" stroke-width="3">
    <path d="M330 140 C330 30 410 30 410 140"/>
    <path d="M560 140 C560 30 640 30 640 140"/>
    <path d="M790 140 C790 30 870 30 870 140"/>
    <path d="M330 260 C330 210 410 210 410 260"/>
    <path d="M560 260 C560 210 640 210 640 260"/>
    <path d="M790 260 C790 210 870 210 870 260"/>
  </g>
  
  <!-- Invariants -->
  <g transform="translate(500, 530)">
    <rect x="0" y="0" width="300" height="50" fill:#e8f5e9 stroke:#4caf50 stroke-width="1" rx="4"/>
    <text x="150" y="25" text-anchor="middle" class="step" font-size="12">I1-I4: Consistent from input to output</text>
  </g>
  
  <!-- AI Seam note -->
  <g transform="translate(850, 550)">
    <rect x="0" y="0" width="120" height="40" fill="#fff8e1" stroke="#f39c12" stroke-width="1" rx="4"/>
    <text x="60" y="20" text-anchor="middle" class="step" font-size="11">@/ai/local + @/ai/llm</text>
  </g>
</svg>
