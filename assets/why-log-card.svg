<?xml version="1.0" encoding="UTF-8"?>
<!-- WhyLog — Why Use It? Benefits Card -->
<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1a1a2e; }
      .benefit { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #2d3436; }
      .desc { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; fill: #666666; }
      .card { fill:#fff; stroke:#dee2e6; stroke-width:1; rx:8; ry:8; }
      .card-primary { fill:#e3f2fd; stroke:#1976d2; stroke-width:2; rx:8; ry:8; }
    </style>
  </defs>
  
  <text x="500" y="40" text-anchor="middle" class="title">Why Use WhyLog?</text>
  
  <!-- 4 benefits in a 2x2 grid -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="220" height="200" class="card-primary" rx="12" ry="12"/>
    <text x="110" y="35" text-anchor="middle" class="benefit">Truth Maintenance</text>
    <text x="110" y="55" text-anchor="middle" class="desc">I1-I4 invariants guarantee consistency</text>
    <text x="110" y="85" text-anchor="middle" class="desc">Non-negotiable invariants govern all transformations</text>
  </g>
  
  <g transform="translate(380, 120)">
    <rect x="0" y="0" width="220" height="200" class="card-primary" rx="12" ry="12"/>
    <text x="110" y="35" text-anchor="middle" class="benefit">Provenance Tracking</text>
    <text x="110" y="55" text-anchor="middle" class="desc">Trace every decision back to source</text>
    <text x="110" y="85" text-anchor="middle" class="desc">Evidence graph with full traceability</text>
  </g>
  
  <g transform="translate(660, 120)">
    <rect x="0" y="0" width="220" height="200" class="card-primary" rx="12" ry="12"/>
    <text x="110" y="35" text-anchor="middle" class="benefit">AI Flexibility</text>
    <text x="110" y="55" text-anchor="middle" class="desc">Local + LLM implementations</text>
    <text x="110" y="85" text-anchor="middle" class="desc">@/ai/local (deterministic) + @/ai/llm (cloud)</text>
  </g>
  
  <g transform="translate(100, 380)">
    <rect x="0" y="0" width="220" height="200" class="card-primary" rx="12" ry="12"/>
    <text x="110" y="35" text-anchor="middle" class="benefit">Phase-Based</text>
    <text x="110" y="55" text-anchor="middle" class="desc">5 clear phases from extraction to presentation</text>
    <text x="110" y="85" text-anchor="middle" class="desc">Phase 0-4: initialization → presentation</text>
  </g>
  
  <!-- Arrow connectors between cards -->
  <g fill="none" stroke="#e94560" stroke-width="2">
    <path d="M330 210 C330 250 410 250 410 210"/>
    <path d="M610 210 C610 250 690 250 690 210"/>
    <path d="M330 470 C330 510 410 510 410 470"/>
    <path d="M610 470 C610 510 690 510 690 470"/>
  </g>
  
  <!-- Key invariant summary -->
  <g transform="translate(500, 540)">
    <rect x="0" y="0" width="400" height="40" fill:#fff8e1 stroke:#f39c12 stroke-width="1" rx="4"/>
    <text x="200" y="25" text-anchor="middle" class="step" font-size="12">I1: Decisions immutable • I2: Provenance traces all • I3: Deterministic extraction • I4: Alternatives scored</text>
  </g>
</svg>
