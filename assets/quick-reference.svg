<?xml version="1.0" encoding="UTF-8"?>
<!-- WhyLog Quick Reference Card -->
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .section { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #1a1a2e; }
      .key { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; fill: #666666; }
      .value { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1a1a2e; }
      .card { fill:#fff; stroke:#dee2e6; stroke-width:1; rx:6; ry:6; }
      .card-primary { fill:#e3f2fd; stroke:#1976d2; stroke-width:2; rx:6; ry:6; }
    </style>
  </defs>
  
  <text x="400" y="40" text-anchor="middle" class="section">WhyLog — Quick Reference</text>
  
  <!-- Phase Summary -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="300" height="160" class="card-primary" rx="8" ry="8"/>
    <text x="150" y="30" text-anchor="middle" class="section">Phases (Top-Down)</text>
    <text x="150" y="50" text-anchor="middle" class="key">Phase 0</text>
    <text x="150" y="65" text-anchor="middle" class="value">Initialization</text>
    <text x="150" y="80" text-anchor="middle" class="key">Phase 1</text>
    <text x="150" y="95" text-anchor="middle" class="value">Extraction</text>
    <text x="150" y="110" text-anchor="middle" class="key">Phase 2</text>
    <text x="150" y="125" text-anchor="middle" class="value">Indexing</text>
    <text x="150" y="140" text-anchor="middle" class="key">Phase 3</text>
    <text x="150" y="155" text-anchor="middle" class="value">Reasoning</text>
    <text x="150" y="170" text-anchor="middle" class="key">Phase 4</text>
    <text x="150" y="185" text-anchor="middle" class="value">Synthesis</text>
    <text x="150" y="200" text-anchor="middle" class="key">Phase 5</text>
    <text x="150" y="215" text-anchor="middle" class="value">Presentation</text>
  </g>
  
  <!-- Invariants -->
  <g transform="translate(400, 100)">
    <rect x="0" y="0" width="380" height="160" class="card-primary" rx="8" ry="8"/>
    <text x="190" y="30" text-anchor="middle" class="section">Invariants (I1-I4)</text>
    <text x="190" y="55" text-anchor="middle" class="key">I1</text>
    <text x="190" y="70" text-anchor="middle" class="value">Decisions immutable</text>
    <text x="190" y="85" text-anchor="middle" class="key">I2</text>
    <text x="190" y="100" text-anchor="middle" class="value">Provenance traces all</text>
    <text x="190" y="115" text-anchor="middle" class="key">I3</text>
    <text x="190" y="130" text-anchor="middle" class="value">Deterministic extraction</text>
    <text x="190" y="145" text-anchor="middle" class="key">I4</text>
    <text x="190" y="160" text-anchor="middle" class="value">Alternatives scored</text>
  </g>
  
  <!-- API endpoints -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="300" height="260" class="card-primary" rx="8" ry="8"/>
    <text x="150" y="30" text-anchor="middle" class="section">Key API Endpoints</text>
    <text x="150" y="55" text-anchor="middle" class="key">POST /extract</text>
    <text x="150" y="70" text-anchor="middle" class="value">Transcript → Decisions</text>
    <text x="150" y="85" text-anchor="middle" class="key">GET /lattice</text>
    <text x="150" y="100" text-anchor="middle" class="value">Decision lattice view</text>
    <text x="150" y="115" text-anchor="middle" class="key">POST /answer</text>
    <text x="150" y="130" text-anchor="middle" class="value">Query with guards</text>
    <text x="150" y="145" text-anchor="middle" class="key">GET /timeline</text>
    <text x="150" y="160" text-anchor="middle" class="value">Version history</text>
    <text x="150" y="175" text-anchor="middle" class="key">POST /export</text>
    <text x="150" y="190" text-anchor="middle" class="value">Export decisions</text>
  </g>
  
  <!-- Store paths -->
  <g transform="translate(460, 320)">
    <rect x="0" y="0" width="320" height="260" class="card-primary" rx="8" ry="8"/>
    <text x="160" y="30" text-anchor="middle" class="section">Store Packages</text>
    <text x="160" y="55" text-anchor="middle" class="key">@/store/whylog</text>
    <text x="160" y="70" text-anchor="middle" class="value">Core boot & bootOnce</text>
    <text x="160" y="85" text-anchor="middle" class="key">@/store/extraction</text>
    <text x="160" y="100" text-anchor="middle" class="value">transcript → decisions</text>
    <text x="160" y="115" text-anchor="middle" class="key">@/store/whylog</text>
    <text x="160" y="130" text-anchor="middle" class="value">Lattice · JTMS · gates</text>
    <text x="160" y="145" text-anchor="middle" class="key">@/ai/local</text>
    <text x="160" y="160" text-anchor="middle" class="value">Local implementation</text>
    <text x="160" y="175" text-anchor="middle" class="key">@/ai/llm</text>
    <text x="160" y="190" text-anchor="middle" class="value">LLM providers</text>
  </g>
  
  <!-- Quick facts -->
  <g transform="translate(50, 550)">
    <rect x="0" y="0" width="700" height="40" fill:#fff8e1 stroke:#f39c12 stroke-width="1" rx="4"/>
    <text x="350" y="25" text-anchor="middle" class="step">⚡ All 275 tests pass · I1-I4 invariants · AI seam: local + LLM</text>
  </g>
</svg>
