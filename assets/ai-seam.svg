<?xml version="1.0" encoding="UTF-8"?>
<!-- WhyLog AI Seam Diagram -->
<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .role { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a2e; }
      .tech { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; fill: #666666; }
      .arrow { fill: #e94560; marker-end: url(#arrowhead); }
      .box { fill:#fff; stroke:#dee2e6; stroke-width:1; rx:6; ry:6; }
      .box-primary { fill:#e3f2fd; stroke:#1976d2; stroke-width:2; rx:6; ry:6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#e94560">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  
  <text x="500" y="40" text-anchor="middle" class="title" font-size="22">WhyLog — AI Seam</text>
  
  <!-- Local Implementation -->
  <g transform="translate(200, 150)">
    <rect x="0" y="0" width="200" height="100" class="box-primary" rx="10"/>
    <text x="100" y="30" text-anchor="middle" class="role" font-size="16">Local Implementation</text>
    <text x="100" y="50" text-anchor="middle" class="tech" font-size="12">@/ai/local</text>
    <text x="100" y="70" text-anchor="middle" class="tech" font-size="11">Deterministic · provenance-tracked · offline-capable</text>
    <circle cx="100" cy="95" r="12" fill="#4a90e2" stroke:#2c5aa0 stroke-width="2"/>
    <text x="100" y="105" text-anchor="middle" class="label" font-size="10">Engine</text>
  </g>
  
  <!-- LLM Implementation -->
  <g transform="translate(800, 150)">
    <rect x="0" y="0" width="200" height="100" class="box-primary" rx="10"/>
    <text x="100" y="30" text-anchor="middle" class="role" font-size="16">LLM Implementation</text>
    <text x="100" y="50" text-anchor="middle" class="tech" font-size="12">@/ai/llm</text>
    <text x="100" y="70" text-anchor="middle" class="tech" font-size="11">Probabilistic · key-dependent · cloud-dependent</text>
    <circle cx="100" cy="95" r="12" fill="#4a90e2" stroke:#2c5aa0 stroke-width="2"/>
    <text x="100" y="105" text-anchor="middle" class="label" font-size="10">Provider</text>
  </g>
  
  <!-- Vertical seam connector -->
  <g fill="none" stroke="#e94560" stroke-width="4">
    <path d="M400 150 V550"/>
  </g>
  
  <!-- Text labels for the seam -->
  <g transform="translate(400, 30)">
    <text x="0" y="0" class="tech" font-size="12" transform="rotate(-90)">AI Seam</text>
  </g>
  
  <!-- Below: Key differences -->
  <g transform="translate(200, 350)">
    <rect x="0" y="0" width="300" height="80" fill:#fff8e1 stroke:#f39c12 stroke-width="1" rx="6"/>
    <text x="150" y="25" text-anchor="middle" class="step" font-size="14">Key Differences</text>
    <text x="150" y="45" text-anchor="middle" class="step" font-size="12">• Local: deterministic, offline, provenance</text>
    <text x="150" y="60" text-anchor="middle" class="step" font-size="12">• LLM: probabilistic, needs key, cloud</text>
  </g>
  
  <!-- Invariants -->
  <g transform="translate(800, 530)">
    <rect x="0" y="0" width="180" height="50" fill:#e8f5e9 stroke:#4caf50 stroke-width="1" rx="4"/>
    <text x="90" y="25" text-anchor="middle" class="step" font-size="12">I1-I4: Invariant across both implementations</text>
  </g>
</svg>
