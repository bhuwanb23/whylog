<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="WhyLog — a decision log that checks itself">
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .h1 { font-size: 62px; font-weight: 700; fill: #e6e9ee; letter-spacing: -1.5; }
    .h2 { font-size: 24px; font-weight: 400; fill: #99a1ad; }
    .chip { font-size: 16.5px; font-weight: 600; }
    .brand { font-size: 34px; font-weight: 700; fill: #e6e9ee; letter-spacing: -0.5; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#07090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#232830"/>

  <!-- brand lockup -->
  <g transform="translate(72,64) scale(0.62)">
    <rect width="128" height="128" rx="28" fill="#0b0d10" stroke="#232830" stroke-width="2"/>
    <path d="M40 58 L54 74 M88 58 L74 74" stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M40 58 L74 74" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-dasharray="5 4" stroke-linecap="round"/>
    <circle cx="40" cy="44" r="14" fill="#0b0d10" stroke="#4ade80" stroke-width="3.5"/>
    <circle cx="88" cy="44" r="14" fill="#0b0d10" stroke="#4ade80" stroke-width="3.5"/>
    <rect x="44" y="74" width="40" height="40" rx="11" fill="#4ade80"/>
  </g>
  <text x="168" y="124" class="brand">WhyLog</text>

  <!-- headline -->
  <text x="72" y="300" class="h1">A decision log that</text>
  <text x="72" y="376" class="h1">checks itself.</text>
  <text x="72" y="432" class="h2">Decisions are beliefs held under assumptions — WhyLog stores the given,</text>
  <text x="72" y="466" class="h2">finds the ones that stopped being true, and proposes the minimal revision.</text>

  <!-- chips -->
  <g transform="translate(72,510)">
    <g>
      <rect width="200" height="46" rx="23" fill="#12151a" stroke="#232830"/>
      <circle cx="26" cy="23" r="7" fill="#4ade80"/>
      <text x="46" y="29" class="chip" fill="#e6e9ee">100% keyless</text>
    </g>
    <g transform="translate(216,0)">
      <rect width="284" height="46" rx="23" fill="#12151a" stroke="#232830"/>
      <circle cx="26" cy="23" r="7" fill="#fbbf24"/>
      <text x="46" y="29" class="chip" fill="#e6e9ee">premise invalidation ★</text>
    </g>
    <g transform="translate(516,0)">
      <rect width="244" height="46" rx="23" fill="#12151a" stroke="#232830"/>
      <circle cx="26" cy="23" r="7" fill="#60a5fa"/>
      <text x="46" y="29" class="chip" fill="#e6e9ee">executable guards</text>
    </g>
  </g>

  <!-- lattice art, right side -->
  <g transform="translate(810,96)">
    <g fill="none" stroke="#4ade80" stroke-width="2.6" stroke-linecap="round">
      <path d="M50 90 L95 270"/>
      <path d="M190 60 L115 270"/>
      <path d="M330 105 L135 270"/>
      <path d="M50 90 L265 270"/>
      <path d="M190 60 L305 270"/>
      <path d="M330 105 L285 270"/>
    </g>
    <g fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round">
      <path d="M50 90 L135 270"/>
      <path d="M330 105 L115 270"/>
    </g>
    <g>
      <circle cx="50" cy="90" r="26" fill="#0b0d10" stroke="#4ade80" stroke-width="4"/>
      <circle cx="190" cy="60" r="26" fill="#0b0d10" stroke="#4ade80" stroke-width="4"/>
      <circle cx="330" cy="105" r="26" fill="#0b0d10" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 6"/>
    </g>
    <g>
      <rect x="80" y="270" width="84" height="84" rx="20" fill="#4ade80"/>
      <rect x="245" y="270" width="84" height="84" rx="20" fill="#4ade80"/>
      <text x="122" y="322" font-size="26" font-weight="700" fill="#06231a" text-anchor="middle">IN</text>
      <text x="287" y="322" font-size="26" font-weight="700" fill="#06231a" text-anchor="middle">IN</text>
    </g>
    <!-- cascade flash -->
    <g fill="none" stroke="#f87171" stroke-width="3" stroke-linecap="round">
      <path d="M122 354 L122 414"/>
      <path d="M112 400 L122 418 L132 400"/>
    </g>
    <text x="122" y="448" font-size="17" font-weight="700" fill="#f87171" text-anchor="middle">premise falsified</text>
    <text x="122" y="474" font-size="15" fill="#99a1ad" text-anchor="middle">the cascade finds what rested on it</text>
  </g>

  <text x="1128" y="596" font-size="15" fill="#6a7280" text-anchor="end">github.com/…/whylog · MIT</text>
</svg>
