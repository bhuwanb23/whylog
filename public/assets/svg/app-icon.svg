<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WhyLog app icon">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a21"/>
      <stop offset="1" stop-color="#07090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App icon: the lattice mark on a deep plate, 1.0x brand palette. -->
  <rect width="512" height="512" rx="116" fill="url(#plate)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="1" y="1" width="510" height="510" rx="116" fill="none" stroke="#232830" stroke-width="2"/>

  <g transform="translate(80,80) scale(2.67)">
    <path d="M40 58 L54 74 M88 58 L74 74" stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M40 58 L74 74" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-dasharray="5 4" stroke-linecap="round"/>
    <circle cx="40" cy="44" r="14" fill="#0b0f14" stroke="#4ade80" stroke-width="3.5"/>
    <circle cx="88" cy="44" r="14" fill="#0b0f14" stroke="#4ade80" stroke-width="3.5"/>
    <rect x="44" y="74" width="40" height="40" rx="11" fill="#4ade80"/>
  </g>
</svg>
