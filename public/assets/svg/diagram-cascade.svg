<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" role="img" aria-label="Premise invalidation cascade with independent-support stop">
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .title { font-size: 34px; font-weight: 700; fill: #e6e9ee; }
    .sub { font-size: 17px; fill: #99a1ad; }
    .p { font-size: 15.5px; font-weight: 600; fill: #e6e9ee; text-anchor: middle; }
    .d { font-size: 15.5px; font-weight: 600; fill: #e6e9ee; text-anchor: middle; }
    .id { font-size: 13px; font-family: 'Cascadia Mono','SF Mono',Consolas,monospace; fill: #6a7280; text-anchor: middle; }
    .tag { font-size: 13px; font-weight: 700; letter-spacing: 1; text-anchor: middle; }
  </style>

  <rect width="1400" height="720" fill="#0b0d10"/>
  <text x="70" y="62" class="title">Gate (c): the world moved — cascade stops at independent support</text>
  <text x="70" y="94" class="sub">Six weeks later the app has four users and is deployed. Nobody contradicted WLD-0007; its premise simply became false.</text>

  <!-- falsified premise -->
  <g transform="translate(70,300)">
    <rect width="230" height="120" rx="14" fill="#1a1013" stroke="#f87171" stroke-width="2.5"/>
    <circle cx="44" cy="44" r="15" fill="none" stroke="#f87171" stroke-width="3"/>
    <path d="M33 33 L55 55 M55 33 L33 55" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
    <text x="74" y="50" font-size="17" font-weight="700" fill="#f87171">falsified</text>
    <text x="24" y="90" font-size="16" font-weight="600" fill="#e6e9ee">scale.single_user</text>
    <text x="24" y="110" font-size="13.5" fill="#99a1ad">now: four users, deployed</text>
  </g>

  <!-- level 1: direct dependents -->
  <g fill="none" stroke="#f87171" stroke-width="2.6" stroke-linecap="round">
    <path d="M300 330 L460 220"/>
    <path d="M300 360 L460 440"/>
    <path d="M292 344 L448 232"/><path d="M448 232 L460 220 L446 218"/>
    <path d="M292 350 L448 452"/><path d="M448 452 L460 440 L446 438"/>
  </g>

  <g>
    <g transform="translate(460,170)">
      <rect width="210" height="100" rx="16" fill="#12151a" stroke="#f87171" stroke-width="2.5"/>
      <text x="105" y="44" class="id">WLD-0007</text>
      <text x="105" y="68" class="d">SQLite, not Postgres</text>
      <rect x="55" y="108" width="100" height="26" rx="13" fill="#f87171"/>
      <text x="105" y="126" class="tag" fill="#2a0a0a">UNSOUND</text>
    </g>
    <g transform="translate(460,392)">
      <rect width="210" height="100" rx="16" fill="#12151a" stroke="#f87171" stroke-width="2.5"/>
      <text x="105" y="44" class="id">WLD-0011</text>
      <text x="105" y="68" class="d">JSON embeddings</text>
      <rect x="55" y="108" width="100" height="26" rx="13" fill="#f87171"/>
      <text x="105" y="126" class="tag" fill="#2a0a0a">UNSOUND</text>
    </g>
  </g>

  <!-- level 2: downstream -->
  <g fill="none" stroke="#f87171" stroke-width="2.6" stroke-linecap="round">
    <path d="M670 220 L840 150"/>
    <path d="M664 232 L828 162"/><path d="M828 162 L840 150 L826 148"/>
    <path d="M670 442 L840 510"/>
    <path d="M664 454 L828 522"/><path d="M828 522 L840 510 L826 508"/>
  </g>
  <g>
    <g transform="translate(840,100)">
      <rect width="210" height="100" rx="16" fill="#12151a" stroke="#f87171" stroke-width="2.5"/>
      <text x="105" y="44" class="id">WLD-0019</text>
      <text x="105" y="68" class="d">no deploy pipeline</text>
      <rect x="55" y="108" width="100" height="26" rx="13" fill="#f87171"/>
      <text x="105" y="126" class="tag" fill="#2a0a0a">UNSOUND</text>
      <text x="105" y="158" font-size="13.5" fill="#fbbf24" text-anchor="middle">the one you forgot existed</text>
    </g>
    <g transform="translate(840,460)">
      <rect width="210" height="100" rx="16" fill="#12151a" stroke="#f87171" stroke-width="2.5"/>
      <text x="105" y="44" class="id">WLD-0023</text>
      <text x="105" y="68" class="d">file-backed cache</text>
      <rect x="55" y="108" width="100" height="26" rx="13" fill="#f87171"/>
      <text x="105" y="126" class="tag" fill="#2a0a0a">UNSOUND</text>
    </g>
  </g>

  <!-- survivor: independent support -->
  <g fill="none" stroke="#4ade80" stroke-width="2.6" stroke-linecap="round">
    <path d="M670 470 L840 320"/>
    <path d="M664 480 L828 332"/><path d="M828 332 L840 320 L826 318"/>
    <!-- second, still-valid premise supporting the survivor -->
    <path d="M1140 250 L1056 306"/>
    <path d="M1068 296 L1054 308 L1066 316"/>
  </g>
  <g transform="translate(840,270)">
    <rect width="210" height="100" rx="16" fill="#101812" stroke="#4ade80" stroke-width="2.5"/>
    <text x="105" y="44" class="id">WLD-0031</text>
    <text x="105" y="68" class="d">offline-first sync</text>
    <rect x="44" y="108" width="122" height="26" rx="13" fill="#4ade80"/>
    <text x="105" y="126" class="tag" fill="#06231a">SURVIVES · IN</text>
  </g>
  <g transform="translate(1140,210)">
    <rect width="200" height="88" rx="14" fill="#0b0d10" stroke="#4ade80" stroke-width="2.5"/>
    <circle cx="34" cy="34" r="14" fill="none" stroke="#4ade80" stroke-width="3"/>
    <text x="60" y="40" font-size="15.5" font-weight="600" fill="#e6e9ee">offline_first</text>
    <text x="24" y="70" font-size="13.5" fill="#99a1ad">still true</text>
  </g>

  <!-- stop marker -->
  <g transform="translate(1104,404)">
    <rect width="252" height="76" rx="12" fill="#12151a" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="126" y="32" font-size="15.5" font-weight="700" fill="#60a5fa" text-anchor="middle">CASCADE STOP</text>
    <text x="126" y="56" font-size="13.5" fill="#99a1ad" text-anchor="middle">independent support · depth cap</text>
  </g>
  <path d="M1056 320 L1104 420" stroke="#60a5fa" stroke-width="2.4" stroke-dasharray="6 5" fill="none"/>

  <!-- minimal backtracking note -->
  <g transform="translate(70,560)">
    <rect width="560" height="104" rx="12" fill="#12151a" stroke="#232830"/>
    <text x="24" y="38" font-size="16.5" font-weight="700" fill="#e6e9ee">Dependency-directed backtracking</text>
    <text x="24" y="66" font-size="14.5" fill="#99a1ad">Retracts the MINIMAL set of assumptions responsible — not</text>
    <text x="24" y="88" font-size="14.5" fill="#99a1ad">everything downstream. Depth-bounded; nogoods block re-assertion.</text>
  </g>

  <g transform="translate(660,560)">
    <rect width="696" height="104" rx="12" fill="#12151a" stroke="#232830"/>
    <text x="24" y="38" font-size="16.5" font-weight="700" fill="#e6e9ee">Nothing is deleted. Every flip writes an event with a reason.</text>
    <text x="24" y="66" font-size="14.5" fill="#99a1ad">Labels change; nodes are never retracted from the log. The human</text>
    <text x="24" y="88" font-size="14.5" fill="#99a1ad">sees a seven-part proposal and decides — the system applies nothing.</text>
  </g>
</svg>
